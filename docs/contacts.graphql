type Query {
  """
  Stored cards, in the name order chosen in Contacts settings unless ordered otherwise.
  """
  contacts(
    limit: Int! = 50
    offset: Int! = 0
    filter: ContactFilter
    orderBy: ContactOrder
  ): ContactPage

  """
  Find a stored card by its identifier; null when missing.
  """
  contact(id: ID!): Contact

  """
  Groups in every container, by name.
  """
  groups(limit: Int! = 50, offset: Int! = 0, filter: GroupFilter): GroupPage

  """
  Find a group by its identifier; null when missing.
  """
  group(id: ID!): Group

  """
  Every container, by identifier.
  """
  containers: [Container!]!

  """
  Find a container by its identifier; null when missing.
  """
  container(id: ID!): Container

  """
  The container new cards go to and the user's own card.
  """
  defaults: Defaults

  """
  Counts across the whole store.
  """
  summary: Summary

  """
  Export cards as one vCard 3.0 file. By default cards are unified, so a person with cards in two accounts is exported once.
  """
  exportVCard(
    """
    Cards to export; all cards when omitted.
    """
    filter: ContactFilter

    """
    Export people as Contacts shows them rather than each stored card; defaults to true.
    """
    unify: Boolean! = true

    """
    Add each card's note, read from Contacts through scripting, which launches Contacts when it is not running; defaults to false.
    """
    includeNotes: Boolean! = false

    """
    Add each card's picture as a PHOTO line; defaults to false.
    """
    includeImages: Boolean! = false
  ): VCardExport
}

input ContactFilter {
  """
  Case- and accent-insensitive substring of any name, the organization, department, job title, an email address, URL, postal address, profile, or related name. A query with three or more digits also matches phone numbers, whatever their punctuation.
  """
  query: String

  """
  Match any of these cards; [] matches nothing.
  """
  identifiers: [ID!]

  """
  Match any of these types; [] matches nothing.
  """
  contactTypes: [ContactType!]

  """
  Match cards stored in any of these containers.
  """
  containerIdentifiers: [ID!]

  """
  Match cards that belong to any of these groups.
  """
  groupIdentifiers: [ID!]

  """
  Match cards that have a value for every one of these keys. NOTE is read from Contacts through scripting, which launches Contacts when it is not running.
  """
  has: [ContactKey!]

  """
  Match cards that have no value for any of these keys.
  """
  missing: [ContactKey!]

  """
  Match cards with an entry carrying any of these labels: a stored token, a custom label, or a built-in label's word such as home, work, mobile, or other.
  """
  labels: [String!]

  """
  Match cards that do, or do not, have an entry with a custom label. Social profiles and instant message addresses are not counted: their labels name the service.
  """
  customLabels: Boolean

  """
  Match cards Contacts does, or does not, show together with another card.
  """
  linked: Boolean

  """
  Created at or after this instant: an RFC 3339 timestamp, or YYYY-MM-DD for that day's midnight in the host zone. Creation dates are read from Contacts through scripting, which launches Contacts when it is not running.
  """
  createdFrom: String

  """
  Created before this instant; same forms and cost as createdFrom.
  """
  createdBefore: String

  """
  Last changed at or after this instant; same forms and cost as createdFrom.
  """
  modifiedFrom: String

  """
  Last changed before this instant; same forms and cost as createdFrom.
  """
  modifiedBefore: String
}

enum ContactType {
  """
  A person.
  """
  PERSON

  """
  A card shown by its company name.
  """
  ORGANIZATION
}

enum ContactKey {
  NAME_PREFIX
  GIVEN_NAME
  MIDDLE_NAME
  FAMILY_NAME
  PREVIOUS_FAMILY_NAME
  NAME_SUFFIX
  NICKNAME
  PHONETIC_GIVEN_NAME
  PHONETIC_MIDDLE_NAME
  PHONETIC_FAMILY_NAME
  PHONETIC_ORGANIZATION_NAME
  ORGANIZATION_NAME
  DEPARTMENT_NAME
  JOB_TITLE
  PHONE_NUMBERS
  EMAIL_ADDRESSES
  POSTAL_ADDRESSES
  URL_ADDRESSES
  CONTACT_RELATIONS
  SOCIAL_PROFILES
  INSTANT_MESSAGE_ADDRESSES
  DATES
  BIRTHDAY
  NON_GREGORIAN_BIRTHDAY

  """
  The card's picture.
  """
  IMAGE_DATA

  """
  The note, which only Contacts scripting provides.
  """
  NOTE
}

input ContactOrder {
  """
  What to sort by. USER_DEFAULT is the name order chosen in Contacts settings; a card without the value sorts last. CREATION_DATE and MODIFICATION_DATE are read from Contacts through scripting, which launches Contacts when it is not running.
  """
  field: ContactSortField!

  """
  ASC or DESC; defaults to ASC.
  """
  direction: SortDirection = ASC
}

enum ContactSortField {
  """
  The name order chosen in Contacts settings.
  """
  USER_DEFAULT

  """
  First name, then last name; a card without a name sorts by organization.
  """
  GIVEN_NAME

  """
  Last name, then first name; a card without a name sorts by organization.
  """
  FAMILY_NAME

  """
  The organization, ignoring case and accents.
  """
  ORGANIZATION_NAME

  """
  Month and day of the birthday, then year.
  """
  BIRTHDAY

  """
  When the card was created; read from Contacts through scripting.
  """
  CREATION_DATE

  """
  When the card last changed; read from Contacts through scripting.
  """
  MODIFICATION_DATE
}

enum SortDirection {
  """
  Smallest or earliest first.
  """
  ASC

  """
  Largest or latest first.
  """
  DESC
}

type ContactPage {
  """
  Stored cards on this page.
  """
  items: [Contact!]!

  """
  Number of matching cards across all pages.
  """
  totalCount: Int!

  """
  Position and availability of neighboring pages.
  """
  pageInfo: PageInfo!
}

